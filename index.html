<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const HULL = '#f1f3f5';

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}

function toTexture(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function seedRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
}

function paintHull(ctx, w, h, { lines = 26 } = {}) {
  const g = ctx.createLinearGradient(0, 0, w, 0);
  [[0, '#e6eaee'], [.18, HULL], [.5, '#ffffff'], [.82, HULL], [1, '#e6eaee']].forEach(([p, c]) => g.addColorStop(p, c));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(120,132,146,.30)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < lines; i++) {
    const x = (w / lines) * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,132,146,.22)';
  for (let i = 1; i < 6; i++) {
    const y = (h / 6) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
}

function drawFlag(ctx, x, y, w) {
  const h = w * 0.68;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#de2910';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffde00';
  const star = (cx, cy, r) => {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.4 : r;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  };
  star(w * 0.17, h * 0.28, w * 0.085);
  [[.40, .10], [.47, .20], [.47, .34], [.40, .44]].forEach(([px, py]) => star(w * px, h * py, w * 0.028));
  ctx.restore();
}

function verticalText(ctx, text, x, y, font, color, spacing = 8) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let cy = y;
  for (const ch of text) { ctx.fillText(ch, x, cy); cy += ctx.measureText(ch).width + spacing; }
  ctx.restore();
}

function flatTexture(color) {
  const [c, ctx] = makeCanvas(64, 64);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 64, 64);
  return toTexture(c);
}

// 级间段:斜撑条蒙皮
function interstageTexture() {
  const [c, ctx] = makeCanvas(512, 256);
  ctx.fillStyle = '#c9d0d7';
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = 'rgba(66,76,90,.65)';
  ctx.lineWidth = 7;
  for (let i = -1; i < 16; i++) {
    ctx.beginPath(); ctx.moveTo(i * 34, 0); ctx.lineTo(i * 34 + 22, 256); ctx.stroke();
  }
  return toTexture(c);
}

// 助推器:白色箭体 + 红色饰带 + 竖排"中国航天" + 国旗
function boosterTexture() {
  const [c, ctx] = makeCanvas(1024, 1024);
  paintHull(ctx, 1024, 1024, { lines: 22 });
  ctx.fillStyle = '#b8bec7'; ctx.fillRect(0, 0, 1024, 44);
  ctx.fillStyle = '#e0483c'; ctx.fillRect(0, 96, 1024, 26);
  ctx.fillStyle = 'rgba(40,52,68,.55)'; ctx.fillRect(0, 138, 1024, 4);
  verticalText(ctx, '中国航天', 300, 380, 'bold 116px "Microsoft YaHei", sans-serif', '#c8332a', 26);
  drawFlag(ctx, 620, 330, 150);
  ctx.fillStyle = '#5b6673';
  ctx.font = '600 52px "Segoe UI", sans-serif';
  ctx.fillText('CZ-2F', 620, 600);
  return toTexture(c);
}

// 芯级:蒙皮分块 + 蓝色标识带
function coreTexture() {
  const [c, ctx] = makeCanvas(1024, 1536);
  paintHull(ctx, 1024, 1536, { lines: 24 });
  ctx.fillStyle = '#1f5c96'; ctx.fillRect(0, 1180, 1024, 30);
  ctx.fillStyle = 'rgba(40,52,68,.35)'; ctx.fillRect(0, 1226, 1024, 5);
  ctx.fillStyle = '#e0483c'; ctx.fillRect(0, 1244, 1024, 12);
  ctx.fillStyle = '#3d4753';
  ctx.font = '600 58px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('CHINA  LONG  MARCH  2F', 512, 1120);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8a939d';
  ctx.font = '44px "Microsoft YaHei", sans-serif';
  ctx.fillText('运载火箭   ·   总装构型', 120, 300);
  return toTexture(c);
}

// 整流罩:国旗 + 型号标识 + 两半对接缝
function fairingTexture() {
  const [c, ctx] = makeCanvas(1024, 1024);
  paintHull(ctx, 1024, 1024, { lines: 18 });
  ctx.fillStyle = '#e0483c'; ctx.fillRect(0, 700, 1024, 20);
  ctx.fillStyle = '#1f5c96'; ctx.fillRect(0, 728, 1024, 8);
  ctx.strokeStyle = 'rgba(96,108,124,.85)';
  ctx.lineWidth = 5;
  for (const x of [0, 512, 1023]) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
  }
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 440); ctx.lineTo(1024, 440); ctx.stroke();
  drawFlag(ctx, 150, 300, 210);
  ctx.fillStyle = '#c8332a';
  ctx.font = 'bold 92px "Microsoft YaHei", sans-serif';
  ctx.fillText('中国航天', 420, 400);
  ctx.fillStyle = '#4c5866';
  ctx.font = '600 54px "Segoe UI", sans-serif';
  ctx.fillText('CZ-2F  /  神 舟', 420, 490);
  return toTexture(c);
}

function skyTexture() {
  const W = 2048, H = 1024;
  const [c, ctx] = makeCanvas(W, H);
  const rnd = seedRandom(20260918);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  [[0, '#070b14'], [.42, '#0a1020'], [.62, '#0b0d18'], [1, '#04050a']].forEach(([p, col]) => bg.addColorStop(p, col));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const nebulae = [
    [360, 300, 520, 'rgba(48,86,168,.30)'],
    [1180, 210, 620, 'rgba(112,58,150,.24)'],
    [1740, 430, 480, 'rgba(170,96,52,.18)'],
    [820, 760, 560, 'rgba(30,104,120,.16)'],
  ];
  for (const [x, y, r, col] of nebulae) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // 银河带:只用柔和色块,星点交给 3D 点云,避免贴图极点拉伸
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {
    const x = (i / 90) * W;
    const y = H * 0.5 + Math.sin((x / W) * Math.PI * 2 + 0.7) * H * 0.16;
    const r = 90 + rnd() * 150;
    const g = ctx.createRadialGradient(x, y + (rnd() - 0.5) * 90, 0, x, y, r);
    g.addColorStop(0, 'rgba(120,140,190,.055)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r * 1.6, r * 2, r * 3.2);
  }
  ctx.restore();
  // 极点处贴图会向一点收敛,压暗两极避免看到"扇形接缝"
  const cap = ctx.createLinearGradient(0, 0, 0, H);
  [[0, '#05070e'], [.12, 'rgba(5,7,14,0)'], [.88, 'rgba(5,7,14,0)'], [1, '#05070e']].forEach(([p, col]) => cap.addColorStop(p, col));
  ctx.fillStyle = cap;
  ctx.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const matPaint = (map, opts = {}) => new THREE.MeshStandardMaterial({
  map, color: 0xffffff, roughness: 0.62, metalness: 0.12, ...opts,
});
const matMetal = (color = 0x4a5058, rough = 0.38) => new THREE.MeshStandardMaterial({
  color, roughness: rough, metalness: 0.92, envMapIntensity: 1.4,
});

function starSprite() {
  const [c, ctx] = makeCanvas(64, 64);
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.32, 'rgba(255,255,255,.7)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

// 星点走 3D 点云:贴图星点在全景极点必然被拉成条纹
function buildStars(count, size, radius, seed, bandBias) {
  const rnd = seedRandom(seed);
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const color = new THREE.Color();
  for (let i = 0; i < count; i++) {
    let u = rnd() * 2 - 1;
    if (rnd() < bandBias) u = ((rnd() + rnd() + rnd()) / 1.5 - 1) * 0.45;
    const t = rnd() * Math.PI * 2;
    const s = Math.sqrt(Math.max(0, 1 - u * u));
    pos[i * 3] = radius * s * Math.cos(t);
    pos[i * 3 + 1] = radius * u;
    pos[i * 3 + 2] = radius * s * Math.sin(t);
    const roll = rnd();
    color.setHSL(roll > 0.9 ? 0.08 : 0.6, roll > 0.82 ? 0.55 : 0.16, 0.5 + rnd() * 0.45);
    col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size, sizeAttenuation: false, map: starSprite(), vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
}

function latheProfile(profile, segments = 64, phiStart = 0, phiLength = Math.PI * 2) {
  return new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), segments, phiStart, phiLength);
}

function engineBell(rTop, rExit, len, mat) {
  const g = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rExit, len, 30, 1, true), mat);
  outer.position.y = -len / 2;
  const inner = new THREE.Mesh(
    new THREE.CylinderGeometry(rTop * 0.94, rExit * 0.9, len * 0.96, 30, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x0d1015, roughness: 0.95, metalness: 0.3, side: THREE.BackSide })
  );
  inner.position.y = -len / 2;
  const cap = new THREE.Mesh(new THREE.CircleGeometry(rTop * 0.95, 30), new THREE.MeshStandardMaterial({ color: 0x171b21, roughness: 0.8, metalness: 0.4 }));
  cap.rotation.x = -Math.PI / 2;
  g.add(outer, inner, cap);
  return g;
}

function buildBooster(texture) {
  const g = new THREE.Group();
  const bodyMat = matPaint(texture);

  const skirt = new THREE.Mesh(latheProfile([[0.62, 0.3], [0.72, 0.35], [1.0, 0.9], [1.2, 2.0], [1.125, 2.6]]), bodyMat);
  g.add(skirt);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.125, 1.125, 12.6, 48, 1), bodyMat);
  body.position.y = 2.6 + 6.3;
  g.add(body);

  const nose = new THREE.Mesh(latheProfile([[1.125, 15.2], [1.08, 16.4], [0.92, 17.6], [0.68, 18.9], [0.42, 20.0], [0.3, 20.4]]), bodyMat);
  g.add(nose);

  const band = new THREE.Mesh(new THREE.TorusGeometry(1.13, 0.055, 8, 48), matMetal(0x8b929c, 0.5));
  band.rotation.x = Math.PI / 2;
  band.position.y = 14.9;
  g.add(band);

  const nozzle = engineBell(0.3, 0.56, 1.6, matMetal(0x50565f, 0.42));
  nozzle.position.y = 0.32;
  g.add(nozzle);

  const udder = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), matMetal(0x2f3540, 0.6));
  udder.position.set(1.1, 11.4, 0);
  g.add(udder);

  return g;
}

function buildStage1(texture) {
  const g = new THREE.Group();
  const bodyMat = matPaint(texture);

  const stage1 = new THREE.Mesh(new THREE.CylinderGeometry(1.675, 1.675, 24.4, 56, 1), bodyMat);
  stage1.position.y = 2.4 + 12.2;
  g.add(stage1);

  const skirt = new THREE.Mesh(latheProfile([[1.22, 0.2], [1.28, 0.34], [1.52, 0.8], [1.72, 2.0], [1.675, 2.6]]), bodyMat);
  g.add(skirt);

  const inter = new THREE.Mesh(
    new THREE.CylinderGeometry(1.7, 1.7, 1.5, 56, 1),
    matPaint(interstageTexture())
  );
  inter.position.y = 26.8;
  g.add(inter);

  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const nozzle = engineBell(0.34, 0.62, 1.9, matMetal(0x545a63, 0.4));
    nozzle.position.set(Math.cos(a) * 0.86, 0.34, Math.sin(a) * 0.86);
    g.add(nozzle);
  }

  const lineGeo = new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(1.68, 24.5, 0.4), new THREE.Vector3(1.74, 20, 0.5), new THREE.Vector3(1.7, 14, 0.45),
    ]), 12, 0.05, 6, false
  );
  for (let i = 0; i < 3; i++) {
    const line = new THREE.Mesh(lineGeo, matMetal(0x2b313a, 0.7));
    line.rotation.y = (i / 3) * Math.PI * 2;
    g.add(line);
  }
  return g;
}

function buildStage2(texture) {
  const g = new THREE.Group();
  const stage2 = new THREE.Mesh(new THREE.CylinderGeometry(1.675, 1.675, 11.4, 56, 1), matPaint(texture));
  stage2.position.y = 27.55 + 5.7;
  g.add(stage2);

  const nozzle = engineBell(0.3, 0.52, 1.5, matMetal(0x545a63, 0.4));
  nozzle.position.y = 27.7;
  g.add(nozzle);
  return g;
}

// 整流罩左右两半:各自半个回转面,贴图各取一半,合起来还原完整环向
function buildFairingHalf(texture, side) {
  const g = new THREE.Group();
  const tex = texture.clone();
  tex.needsUpdate = true;
  tex.repeat.set(.5, 1);
  tex.offset.x = side * .5;
  const bodyMat = matPaint(tex);
  bodyMat.side = THREE.DoubleSide;
  const start = side * Math.PI;

  const adapter = new THREE.Mesh(latheProfile([[1.675, 38.9], [1.86, 39.9], [1.9, 40.4]], 32, start, Math.PI), bodyMat);
  g.add(adapter);

  const shell = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 6.6, 28, 1, true, start, Math.PI), bodyMat);
  shell.position.y = 43.7;
  g.add(shell);

  const nose = new THREE.Mesh(latheProfile([
    [1.9, 47.0], [1.885, 48.1], [1.83, 49.2], [1.72, 50.2], [1.55, 51.1], [1.3, 51.9], [.95, 52.6], [.62, 53.0], [.5, 53.1],
  ], 32, start, Math.PI), bodyMat);
  g.add(nose);

  for (let i = 0; i < 2; i++) {
    const a = (i / 2) * Math.PI + start + Math.PI / 4;
    const pod = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .34, 12), matMetal(0x30363f, .55));

function concreteTexture() {
  const [c, ctx] = makeCanvas(1024, 1024);
  const rnd = seedRandom(8123);
  ctx.fillStyle = '#3a4048';
  ctx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 12000; i++) {
    const v = 90 + rnd() * 120;
    ctx.fillStyle = `rgba(${v},${v + 6},${v + 14},${rnd() * 0.14})`;
    ctx.fillRect(rnd() * 1024, rnd() * 1024, 3, 3);
  }
  ctx.strokeStyle = 'rgba(10,14,20,.5)';
  ctx.lineWidth = 4;
  for (let i = 0; i <= 12; i++) {
    const p = (i / 12) * 1024;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 1024); ctx.moveTo(0, p); ctx.lineTo(1024, p); ctx.stroke();
  }
  return toTexture(c);
}

function earthTexture() {
  const [c, ctx] = makeCanvas(1024, 512);
  const rnd = seedRandom(777);
  ctx.fillStyle = '#2b5a86';
  ctx.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 150; i++) {
    const x = rnd() * 1024, y = rnd() * 512, r = 18 + rnd() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${46 + rnd() * 34 | 0},${96 + rnd() * 44 | 0},${68 + rnd() * 30 | 0},.75)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 110; i++) {
    const x = rnd() * 1024, y = rnd() * 512, w = 30 + rnd() * 150, h = 5 + rnd() * 16;
    ctx.fillStyle = `rgba(238,245,252,${.1 + rnd() * .2})`;
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, rnd() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  return toTexture(c);
}

// 粒子点径上限由驱动决定,写死 512 在部分 GPU 上会被静默截断
function maxPointSize() {
  const gl = renderer.getContext();
  const range = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
  return Math.min(512, (range && range[1]) || 64);
}

// 粒子:贴图星点/几何体会在远距离失真,点云用自定义着色器按世界尺寸投影
function makeEmitter(count, blending, sprite) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  const alp = new Float32Array(count);
  const vel = new Float32Array(count * 3);
  const ttl = new Float32Array(count);
  const life = new Float32Array(count);
  const grow = new Float32Array(count);
  const base = new Float32Array(count);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: sprite }, uScale: { value: 500 }, uMax: { value: maxPointSize() } },
    vertexShader: `
      attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
      uniform float uScale; uniform float uMax; varying vec3 vC; varying float vA;
      void main() {
        vC = aColor; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * uScale / max(1.0, -mv.z), 0.0, uMax);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; varying vec3 vC; varying float vA;
      void main() { gl_FragColor = vec4(vC, texture2D(uTex, gl_PointCoord).a * vA); }`,
    transparent: true, depthWrite: false, blending,
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  let head = 0;

  return {
    points,
    emit(x, y, z, vx, vy, vz, size, endSize, time, r, g, b, alpha) {
      const i = head; head = (head + 1) % count;
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      vel[i * 3] = vx; vel[i * 3 + 1] = vy; vel[i * 3 + 2] = vz;
      col[i * 3] = r; col[i * 3 + 1] = g; col[i * 3 + 2] = b;
      siz[i] = size; grow[i] = (endSize - size) / time; ttl[i] = time; life[i] = time; base[i] = alpha;
    },
    step(dt, drag, buoy, scale) {
      mat.uniforms.uScale.value = scale;
      for (let i = 0; i < count; i++) {
        if (life[i] <= 0) { if (alp[i] !== 0) alp[i] = 0; continue; }
        life[i] -= dt;
        const k = i * 3;
        const d = Math.max(0, 1 - drag * dt);
        vel[k] *= d; vel[k + 2] *= d;
        vel[k + 1] = vel[k + 1] * d + buoy * dt;
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        const t = Math.max(0, life[i] / ttl[i]);
        siz[i] += grow[i] * dt;
        alp[i] = base[i] * t * t;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aSize.needsUpdate = true;
      geo.attributes.aAlpha.needsUpdate = true;
      geo.attributes.aColor.needsUpdate = true;
    },
    clear() { for (let i = 0; i < count; i++) { life[i] = 0; alp[i] = 0; } geo.attributes.aAlpha.needsUpdate = true; },
  };
}

const BURN_END = 50;
const gravity = (alt) => 9.81 * (6371e3 / (6371e3 + Math.max(0, alt))) ** 2;

// ---- 入轨弹道:真实数值关键帧插值,视觉尺度压缩到 6 km 地球 ----
const ORB_KEYS = [
  [0, 0, 0, 0], [60, 2.5e3, 320, 4e2], [128, 4.5e4, 1500, 8e3],
  [163, 6.8e4, 2100, 2.2e4], [203, 9.6e4, 3e3, 4.5e4],
  [340, 1.6e5, 6300, 2.5e5], [500, 2.0e5, 7800, 6e5],
];
const SEV = { tower: 40, booster: 128, staging: 163, fairing: 203, meco: 500 };

// 单调三次插值(Fritsch–Carlson):普通样条会在起点过冲,导致起飞瞬间高度倒退
function keyAt(col, t) {
  const K = ORB_KEYS, n = K.length;
  if (t <= K[0][0]) return K[0][col];
  if (t >= K[n - 1][0]) return K[n - 1][col];
  let i = 0;
  while (i < n - 2 && t > K[i + 1][0]) i++;
  const dx = K[i + 1][0] - K[i][0];
  const m = (j) => {
    if (j <= 0 || j >= n - 1) {
      const a = Math.max(0, Math.min(n - 2, j)), b = a + (j === 0 ? 1 : -1);
      return (K[b][col] - K[a][col]) / (K[b][0] - K[a][0]);
    }
    const d1 = (K[j][col] - K[j - 1][col]) / (K[j][0] - K[j - 1][0]);
    const d2 = (K[j + 1][col] - K[j][col]) / (K[j + 1][0] - K[j][0]);
    return d1 * d2 <= 0 ? 0 : 3 * d1 * d2 / Math.max(d1 + d2, 1e-9);
  };
  const u = (t - K[i][0]) / dx, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * K[i][col] + (u3 - 2 * u2 + u) * m(i) * dx
    + (-2 * u3 + 3 * u2) * K[i + 1][col] + (u3 - u2) * m(i + 1) * dx;
}

const UP = new THREE.Vector3(0, 1, 0);
const _pa = new THREE.Vector3(), _pb = new THREE.Vector3(), _dir = new THREE.Vector3();
const _wp = new THREE.Vector3(), _off = new THREE.Vector3();

function earthPos(alt, range, out) {
  const th = range / R_REAL;
  return earthRad(R_VIS + alt * ALT_VIS, th, out);
}
function earthRad(rad, th, out) {
  return out.set(rad * Math.sin(th), -R_VIS + rad * Math.cos(th), 0);
}

// 两个采样点重合时归一化会得到零四元数,箭体姿态会整帧变 NaN
function aimAtFlightPath() {
  if (_dir.subVectors(_pb, _pa).lengthSq() < 1e-8) return;
  rocket.quaternion.setFromUnitVectors(UP, _dir.normalize());
}

const ENG = {
  boosters: NOZZLES.filter((n) => !n.core),
  stage1: NOZZLES.filter((n) => n.core),
  stage2: [{ x: 0, y: 26.2, z: 0 }],
};
const HOST_FLAG = { boosters: 'booster', stage1: 'core', stage2: 'upper' };
const HOST_NAMES = Object.keys(ENG);
const HOSTS = {};
for (const host of HOST_NAMES) {
  HOSTS[host] = { p: new THREE.Vector3(), q: new THREE.Quaternion(), d: new THREE.Vector3(), s: new THREE.Vector3(), o: new THREE.Vector3() };
}

// ---- 发射时序 ----
const el = {
  hud: document.getElementById('hud'),
  t: document.getElementById('h-t'),
  alt: document.getElementById('h-alt'),
  vel: document.getElementById('h-vel'),
  eng: document.getElementById('h-eng'),
  warp: document.getElementById('h-warp'),
  orb: document.getElementById('h-orb'),
  orbRow: document.getElementById('row-orbit'),
  count: document.getElementById('count'),
  btn: document.getElementById('launch'),
  chips: [...document.querySelectorAll('.chip')],
};
const L = {
  mode: 'sub', phase: 'idle', t: 0, alt: 0, vis: 0, vel: 0, range: 0, th: 0, rad: R_VIS, wth: 0,
  throttle: 0, cut: false, labelT: 0, label: '', warp: 1, shake: 0, tImpact: 0, armOpen: false,
  camWant: 0, laps: 0, orbSpeed: 7800,
};
const stage = { booster: true, core: true, upper: false };
const debris = [];
let pAcc = 0, sAcc = 0, dAcc = 0, glow = 0;
const drawBuf = new THREE.Vector2();
const basePos = new THREE.Vector3();
const prevBase = new THREE.Vector3();

function say(text, seconds) { L.label = text; L.labelT = seconds; }

function setMode(mode) {
  if (L.phase !== 'idle') return;
  L.mode = mode;
  el.chips.forEach((c) => c.classList.toggle('on', c.dataset.mode === mode));
  earth.visible = mode === 'orb';
  controls.maxDistance = mode === 'orb' ? 2e4 : 620;
}
el.chips.forEach((c) => c.addEventListener('click', () => { c.blur(); setMode(c.dataset.mode); }));

function startLaunch() {
  L.phase = 'count';
  L.t = 10;
  controls.autoRotate = false;
  el.btn.textContent = '中止并复位';
  el.btn.classList.add('abort');
  el.orbRow.hidden = L.mode !== 'orb';
  el.chips.forEach((c) => { c.disabled = true; });
}

function restoreParts() {
  const all = [parts.boosters, parts.stage1, parts.stage2, ...parts.fairings, parts.tower];
  for (const o of all) {
    if (o.parent !== rocket) {
      scene.remove(o);
      rocket.add(o);
    }
    o.position.set(0, 0, 0);
    o.quaternion.identity();
    o.visible = true;
  }
  debris.length = 0;
  Object.assign(stage, { booster: true, core: true, upper: false });
}

function resetLaunch() {
  Object.assign(L, {
    phase: 'idle', t: 0, alt: 0, vis: 0, vel: 0, range: 0, th: 0, rad: R_VIS, wth: 0,
    throttle: 0, cut: false, labelT: 0, armOpen: false, warp: 1, shake: 0, tImpact: 0, camWant: 0, laps: 0,
  });
  pAcc = sAcc = dAcc = glow = 0;
  restoreParts();
  rocket.position.copy(basePos.set(0, 0, 0));
  prevBase.copy(basePos);
  rocket.quaternion.identity();
  plume.clear();
  smoke.clear();
  padLight.intensity = 0;
  shock.visible = false;
  shock.material.opacity = 0;
  el.count.style.opacity = '0';
  el.eng.textContent = '待机';
  el.warp.textContent = '×1';
  el.orb.textContent = '—';
  el.btn.textContent = '点火起飞';
  el.btn.classList.remove('abort');
  el.chips.forEach((c) => { c.disabled = false; });
  controls.target.copy(TARGET);
  camera.position.copy(TARGET).addScaledVector(DEFAULT_DIR, fitDistance());
  controls.update();
}

el.btn.addEventListener('click', () => {
  el.btn.blur();
  L.phase === 'idle' ? startLaunch() : resetLaunch();
});

function detach(obj, back, wrad, spin) {
  scene.attach(obj);
  debris.push({ obj, th: L.th, rad: L.rad, wth: L.wth * back, wrad, spin, ttl: 90, axis: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize() });
}

function stepOrbit(dt) {
  L.warp = L.t < 25 ? 1 : 10;
  const sdt = dt * L.warp;
  L.t += sdt;

  if (L.t >= SEV.meco) {
    L.phase = 'orbit';
    L.throttle = 0;
    stage.booster = stage.core = stage.upper = false;
    say('入轨成功 · 轨道 200 km', 5);
    el.eng.textContent = '在轨飞行';
    el.btn.textContent = '返回发射台';
    L.camWant = 70;
    return;
  }
  if (L.t >= SEV.tower && parts.tower.parent === rocket) {
    say('逃逸塔分离', 2.4);
    detach(parts.tower, .96, -14, .5);
  }
  if (L.t >= SEV.booster && parts.boosters.parent === rocket) {
    say('助推器分离', 2.4);
    detach(parts.boosters, .94, -22, .32);
    stage.booster = false;
    el.eng.textContent = '芯级飞行';
  }
  if (L.t >= SEV.staging && parts.stage1.parent === rocket) {
    say('一二级分离 · 二级点火', 2.8);
    detach(parts.stage1, .92, -18, .26);
    stage.core = false;
    stage.upper = true;
    el.eng.textContent = '二级飞行';
  }
  if (L.t >= SEV.fairing && parts.fairings[0].parent === rocket) {
    say('抛整流罩', 2.4);
    parts.fairings.forEach((f, i) => detach(f, .95, -9 - i * 5, .4));
  }

  const prev = orbState(L.t);
  const next = orbState(L.t + 2);
  L.alt = next.alt;
  L.vel = next.v;
  L.range = next.x;
  L.vis = L.alt * ALT_VIS;
  earthPos(L.alt, L.range, _pb);
  aimAtFlightPath();
  basePos.copy(_pb);
  L.th = L.range / R_REAL;
  L.rad = R_VIS + L.alt * ALT_VIS;
  L.wth = next.v / R_REAL;
  earthPos(prev.alt, prev.x, _pa);
}

function orbState(t) {
  return { alt: keyAt(1, t), v: keyAt(2, t), x: keyAt(3, t) };
}

function stepLaunch(dt, now) {
  const active = L.phase !== 'idle' && L.phase !== 'count';

  if (L.phase === 'count') {
    L.t -= dt;
    say(`T-${Math.max(1, Math.ceil(L.t))}`, 0.2);
    if (L.t <= 3.2) { L.armOpen = true; el.eng.textContent = '程序对接'; }
    if (L.t <= 0) {
      L.phase = 'ignite';
      L.throttle = 0;
      say('点火', 1.6);
      el.eng.textContent = '点火';
      earthPos(0, 0, _pa);
      basePos.copy(_pa);
      prevBase.copy(_pa);
      for (let i = 0; i < 220; i++) {
        plume.emit(
          (Math.random() - .5) * 14, 1 + Math.random() * 2, (Math.random() - .5) * 14,
          (Math.random() - .5) * 26, 6 + Math.random() * 16, (Math.random() - .5) * 26,
          2 + Math.random() * 3, 20 + Math.random() * 14, 3 + Math.random() * 2.5,
          .92, .94, 1, .5
        );
      }
    }
  } else if (L.phase === 'ignite') {
    L.throttle = Math.min(1, L.throttle + dt / 1.15);
    if (L.throttle >= .96) {
      L.phase = 'ascent';
      L.t = 0;
      say('起飞', 2.6);
      el.eng.textContent = '满推力';
    }
  } else if (L.mode === 'orb' && active && L.phase !== 'orbit') {
    stepOrbit(dt);
  } else if (L.phase === 'ascent') {
    L.t += dt;
    L.vel += (2.6 + .09 * L.t) * dt;
    L.alt += L.vel * dt;
    L.vis = L.alt;
    if (L.t >= BURN_END) {
      L.phase = 'coast';
      L.cut = true;
      say('MECO · 发动机关机', 2.4);
      el.eng.textContent = '惯性飞行';
    }
  } else if (L.phase === 'coast') {
    // 高空段用时间加速压缩惯性等待,最后 1.5 km 恢复实时
    L.warp = L.alt > 1500 ? 1.6 : 1;
    const sdt = dt * L.warp;
    L.t += sdt;
    L.vel -= gravity(L.alt) * sdt;
    L.alt += L.vel * sdt;
    L.vis = L.alt;
    L.throttle = Math.max(0, L.throttle - dt / 1.8);
    if (L.vel < 0 && L.cut) { L.cut = false; el.eng.textContent = '自由落体'; }
    if (L.vel < -25) {
      dAcc += dt * 900 * L.warp;
      while (dAcc >= 1) {
        dAcc -= 1;
        plume.emit(
          (Math.random() - .5) * 5.6, L.alt - 1.3, (Math.random() - .5) * 5.6,
          (Math.random() - .5) * 14, 10 + Math.random() * 26, (Math.random() - .5) * 14,
          1.4 + Math.random() * 1.6, 9 + Math.random() * 8, .5 + Math.random() * .45,
          1, .55 + Math.random() * .3, .22, .34
        );
      }
    }
    if (L.alt <= 0) {
      L.alt = L.vis = 0;
      L.phase = 'impact';
      L.tImpact = 0;
      L.warp = 1;
      L.shake = 1;
      glow = 2600;
      say(`撞击台架 · 冲击速度 ${Math.round(-L.vel)} m/s`, 6);
      el.eng.textContent = '坠毁';
      el.btn.textContent = '返回发射台';
      shock.visible = true;
      shock.scale.setScalar(1);
      shock.material.opacity = .95;
      for (let i = 0; i < 300; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 26 + Math.random() * 54;
        smoke.emit(
          Math.cos(ang) * 3, 1 + Math.random() * 3, Math.sin(ang) * 3,
          Math.cos(ang) * sp, 3 + Math.random() * 9, Math.sin(ang) * sp,
          3 + Math.random() * 5, 40 + Math.random() * 30, 5 + Math.random() * 3,
          .66, .64, .6, .5
        );
      }
      for (let i = 0; i < 240; i++) {
        const ang = Math.random() * Math.PI * 2;
        plume.emit(
          0, 2, 0,
          Math.cos(ang) * (10 + Math.random() * 40), 20 + Math.random() * 90, Math.sin(ang) * (10 + Math.random() * 40),
          1.5 + Math.random() * 2, 14 + Math.random() * 12, .7 + Math.random() * .8,
          1, .8, .5, .7
        );
      }
    }
  } else if (L.phase === 'impact') {
    L.tImpact += dt;
    const k = Math.min(1, L.tImpact / 5);
    shock.scale.setScalar(1 + k * 240);
    shock.material.opacity = .95 * (1 - k) ** 2;
    if (k >= 1) shock.visible = false;
    glow = 2600 * Math.max(0, 1 - L.tImpact / 2.6) ** 2;
    if (L.tImpact < 4.5) {
      sAcc += dt * 190;
      while (sAcc >= 1) {
        sAcc -= 1;
        const ang = Math.random() * Math.PI * 2;
        const sp = 6 + Math.random() * 20;
        smoke.emit(
          Math.cos(ang) * (1 + Math.random() * 5), 1 + Math.random() * 6, Math.sin(ang) * (1 + Math.random() * 5),
          Math.cos(ang) * sp, 4 + Math.random() * 8, Math.sin(ang) * sp,
          4 + Math.random() * 5, 30 + Math.random() * 22, 5 + Math.random() * 3,
          .62, .6, .58, .45
        );
      }
    }
  } else if (L.phase === 'orbit') {
    L.warp = 6;
    const sdt = dt * L.warp;
    L.t += sdt;
    L.range += L.orbSpeed * sdt;
    L.th = L.range / R_REAL;
    L.laps = L.th / (Math.PI * 2);
    earthPos(L.alt, L.range, _pb);
    aimAtFlightPath();
    basePos.copy(_pb);
    earthPos(L.alt, L.range - L.orbSpeed * 2, _pa);
    el.orb.textContent = `近 200 × 远 200 km · ${L.laps.toFixed(2)} 圈`;
  }

  // 箭体位置:亚轨道沿 Y 上升,入轨沿地球局部坐标系
  earth.userData.haze.visible = L.vis > 250;
  if (L.mode === 'sub') {
    basePos.set(0, L.alt, 0);
    rocket.quaternion.identity();
  }
  rocket.position.copy(basePos);
  if (L.phase === 'ignite') {
    const j = L.throttle * .1;
    rocket.position.x += Math.sin(now * .062) * j;
    rocket.position.z += Math.cos(now * .049) * j;
  }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.ttl -= dt;
    d.th += d.wth * dt * L.warp;
    d.wrad -= 5 * dt * L.warp;
    d.rad += d.wrad * dt * L.warp;
    earthRad(d.rad, d.th, d.obj.position);
    d.obj.rotateOnAxis(d.axis, d.spin * dt * L.warp);
    if (d.rad < R_VIS - 400 || d.ttl <= 0) {
      scene.remove(d.obj);
      debris.splice(i, 1);
    }
  }

  const openArm = L.armOpen || active;
  tower.arms.forEach((a, i) => {
    a.rotation.y += ((openArm ? -1.2 - i * .1 : 0) - a.rotation.y) * Math.min(1, dt * 1.7);
  });

  const engTh = L.throttle;
  let flick = 0, lit = 0;
  for (const key of ['booster', 'core', 'upper']) {
    const th = stage[key] ? engTh : 0;
    flames[key].forEach((m, i) => {
      const n = .82 + .18 * Math.sin(now * .043 + i * 2.1) * Math.sin(now * .017 + i * .7);
      m.visible = th > .02;
      m.material.opacity = th * .95 * n;
      m.scale.set(.8 + .3 * n, (.3 + .8 * th) * n, .8 + .3 * n);
      if (m.visible) { flick += n; lit++; }
    });
  }
  padLight.intensity = engTh * (lit ? 2400 * flick / lit : 0) + glow;
  padLight.position.set(rocket.position.x, L.mode === 'orb' ? 3 : L.alt + 3, rocket.position.z);

  const srcs = [];
  for (const host of HOST_NAMES) {
    if (!stage[HOST_FLAG[host]]) continue;
    const h = HOSTS[host];
    parts[host].getWorldPosition(h.p);
    parts[host].getWorldQuaternion(h.q);
    h.d.set(0, -1, 0).applyQuaternion(h.q);
    h.s.set(1, 0, 0).applyQuaternion(h.q);
    h.o.set(0, 0, 1).applyQuaternion(h.q);
    for (const n of ENG[host]) srcs.push({ n, h });
  }
  if (engTh > .05 && srcs.length) {
    pAcc += dt * 1200 * engTh * L.warp;
    while (pAcc >= 1) {
      pAcc -= 1;
      const { n, h } = srcs[(Math.random() * srcs.length) | 0];
      const ang = Math.random() * Math.PI * 2;
      const spread = Math.random() * .6;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const speed = 60 + 110 * Math.random() * engTh;
      _off.set(n.x, n.y, n.z).applyQuaternion(h.q);
      plume.emit(
        h.p.x + _off.x + (h.s.x * ca + h.o.x * sa) * spread,
        h.p.y + _off.y + (h.s.y * ca + h.o.y * sa) * spread,
        h.p.z + _off.z + (h.s.z * ca + h.o.z * sa) * spread,
        h.d.x * speed + (Math.random() - .5) * 14,
        h.d.y * speed + (Math.random() - .5) * 14,
        h.d.z * speed + (Math.random() - .5) * 14,
        1 + Math.random(), 5 + Math.random() * 4, .45 + Math.random() * .5,
        1, .48 + Math.random() * .34, .16, .6
      );
    }
  }
  if (engTh > .05 && L.vis < 200) {
    sAcc += dt * 140 * engTh;
    while (sAcc >= 1) {
      sAcc -= 1;
      const ang = Math.random() * Math.PI * 2;
      const r = 7 + Math.random() * 8;
      const sp = 10 + Math.random() * 17;
      smoke.emit(
        Math.cos(ang) * r, .8 + Math.random() * 3.5, Math.sin(ang) * r,
        Math.cos(ang) * sp, 2 + Math.random() * 5, Math.sin(ang) * sp,
        3 + Math.random() * 4, 26 + Math.random() * 24, 4.5 + Math.random() * 3,
        .7, .73, .78, .4
      );
    }
  }

  const db = renderer.getDrawingBufferSize(drawBuf);
  const scale = (db.y * .5) / Math.tan(THREE.MathUtils.degToRad(camera.fov * .5));
  plume.step(dt, 1.7, 7, scale);
  smoke.step(dt, .5, 2.1, scale);

  // 与箭体等量平移:滞后跟踪在高速段会把箭体甩出画面
  if (active) {
    _wp.subVectors(basePos, prevBase);
    controls.target.add(_wp);
    camera.position.add(_wp);
    // 分离后主体变了,把关注点缓动到当前箭体中心(平移不改变视角与距离)
    _off.copy(basePos).addScaledVector(L.mode === 'orb' ? _dir : UP, L.mode === 'orb' ? 42 : 29.7)
      .sub(controls.target).multiplyScalar(Math.min(1, dt * 1.6));
    controls.target.add(_off);
    camera.position.add(_off);
    if (L.camWant > 0) {
      const d = camera.position.distanceTo(controls.target);
      const next = d + (L.camWant - d) * Math.min(1, dt * .9);
      setDistance(next);
      if (Math.abs(next - L.camWant) < 2) L.camWant = 0;
    }
  }
  prevBase.copy(basePos);

  const secs = L.phase === 'count' ? -L.t : L.phase === 'idle' ? -10 : L.t;
  const a = Math.abs(secs);
  el.t.textContent = (secs < 0 ? 'T- ' : 'T+') + `${String(Math.floor(a / 60)).padStart(2, '0')}:${(a % 60).toFixed(1).padStart(4, '0')}`;
  el.alt.textContent = L.alt < 1000 ? `${L.alt.toFixed(0)} m` : `${(L.alt / 1000).toFixed(2)} km`;
  el.vel.textContent = `${L.vel.toFixed(0)} m/s`;
  el.warp.textContent = `×${L.warp.toFixed(1)}`;
  if (L.mode === 'sub') el.orb.textContent = '—';
  el.hud.classList.toggle('live', active);

  L.shake = Math.max(0, L.shake - dt * .42);

  L.labelT = Math.max(0, L.labelT - dt);
  el.count.textContent = L.phase === 'count' ? L.label : L.labelT > 0 ? L.label : '';
  el.count.style.opacity = L.phase === 'count' ? '1' : String(Math.min(1, L.labelT * 1.4));
}

renderer.domElement.addEventListener('wheel', () => { L.camWant = 0; }, { passive: true });

addEventListener('pointerdown', () => { controls.autoRotate = false; }, { once: true });
addEventListener('wheel', () => { controls.autoRotate = false; }, { once: true, passive: true });

function resetView() {
  // 只复位视角与距离:入轨后关注点已随箭体离开世界轴
  camera.position.copy(controls.target).addScaledVector(DEFAULT_DIR, fitDistance());
  controls.update();
}
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'r' || e.key === 'R') resetView();
  if (e.code === 'Space') {
    // 焦点在按钮上时交还给浏览器原生激活,避免和 click 叠加成双重切换
    if (document.activeElement?.tagName === 'BUTTON') return;
    e.preventDefault();
    L.phase === 'idle' ? startLaunch() : resetLaunch();
  }
});
renderer.domElement.addEventListener('dblclick', resetView);

addEventListener('resize', () => {
  // 面板被隐藏时视口是 0,算出的 aspect 与距离会变成 NaN 且再也回不来
  if (!innerWidth || !innerHeight) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  const fit = fitDistance();
  setDistance(camera.position.distanceTo(controls.target) * (fit / lastFit));
  lastFit = fit;
  controls.update();
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  stepLaunch(Math.min(.05, clock.getDelta()), now);
  stars.position.copy(camera.position);
  camera.far = L.mode === 'orb' && L.vis > 400 ? 4e5 : 4e4;
  camera.updateProjectionMatrix();
  controls.update();
  if (L.shake > 0) {
    const s = L.shake * L.shake * .016;
    camera.rotateZ(Math.sin(now * .071) * s);
    camera.rotateX(Math.cos(now * .093) * s);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
